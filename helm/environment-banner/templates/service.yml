apiVersion: v1
kind: Service
metadata:
  name: environment-banner
  labels:
    app: environment-banner
    environment: {{ .Values.env | quote }}

spec:
  type: {{ .Values.service.type }}

  selector:
    app: environment-banner

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP